name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the installer to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run make

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: out/make/squirrel.windows/x64/JiraWeekHours-Setup.exe
          archive: false

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/make/squirrel.windows/x64/JiraWeekHours-Setup.exe
